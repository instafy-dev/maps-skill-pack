name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Manifest is up to date
        run: node scripts/manifest.mjs --check
      - name: Unit tests
        run: node --test tests/*.test.mjs
